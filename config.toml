# Configuración de Maripepis. Copia/edita a tu gusto.

[audio]
sample_rate = 16000            # 16 kHz: lo que espera Whisper
input_device = "default"       # micrófono (arecord -D); "default" = del sistema
output_device = "default"      # altavoz (aplay -D); "default" = del sistema

[vad]
enabled = false                # true, o usa --handsfree, para manos libres (sin Enter)
backend = "webrtc"             # de momento solo "webrtc"
aggressiveness = 2             # 0-3 (más alto = corta antes con ruido de fondo)
silence_ms = 800               # silencio (ms) para dar la frase por terminada
max_utterance_ms = 15000       # tope de duración de una intervención
min_speech_ms = 500            # voz real mínima; por debajo se descarta como ruido

[stt]
enabled = false                # true, o usa --listen, para hablar por micrófono
engine = "whisper"
model = "large-v3-turbo"       # lo mejor calidad/velocidad en GPU (descarga ~1.6 GB la 1ª vez)
                               # sin GPU, usa "medium" o "small" con device="cpu"
language = "es"                # "es" fijo, o "auto" para detectar idioma
device = "cuda"                # cuda (tu RTX 5070) | cpu
compute_type = "float16"       # float16 (GPU) | int8 (CPU)
beam_size = 5                  # más alto = un poco más preciso y más lento
# Pista de vocabulario/contexto: mejora nombres propios y jerga.
initial_prompt = "Conversación en español con el asistente Maripepis."

[llm]
backend = "claude-code"        # claude | claude-code  ← cambia SOLO esta línea
                               # claude-code = tu suscripción de Claude, vía el CLI de Claude Code
                               # claude      = API de Anthropic (ANTHROPIC_API_KEY, se paga por token)
                               # Son el mismo Claude por dos caminos que se pagan
                               # distinto; se puede saltar de uno a otro sin reiniciar
                               # con `maripepis-hotkey backend claude`.
stream = true
max_history = 10
# Ojo al escribirlo: esto se lee EN VOZ ALTA (Piper). Todo lo que no sea texto
# llano —markdown, enlaces, bloques de «Fuentes:»— se pronuncia tal cual, y una
# URL dicha letra a letra arruina la respuesta. Con WebSearch (backend
# claude-code) pasa siempre si no se le prohíbe aquí.
system_prompt = "Eres Maripepis, un asistente de voz breve muy majo, cercano y en español. Responde directamente, sin preámbulos, en 1-3 frases. Te van a leer en voz alta: escribe texto llano, sin markdown, sin enlaces y sin listas de fuentes; si citas algo, di el nombre del sitio y ya."

[llm.claude]
model = "claude-opus-4-8"      # o "claude-haiku-4-5" para menor latencia/coste en respuestas cortas
max_tokens = 1024              # las respuestas de voz son breves
# La clave NO va aquí: se lee de la variable de entorno ANTHROPIC_API_KEY

[llm.claude_code]
# Backend "claude-code": no usa clave de API, usa tu SUSCRIPCIÓN. Habla con el
# binario `claude` (Claude Code) en modo --print y le lee la respuesta según se
# genera. Requisito: tener Claude Code instalado y haber entrado con tu cuenta
# (ejecuta `claude` y usa /login). Si tienes ANTHROPIC_API_KEY en el entorno, se
# ignora a propósito: si no, el turno se cobraría por token sin que se note.
cli = "claude"                 # ejecutable (o ruta completa si no está en el PATH)
model = ""                     # "" = el que tenga Claude Code; "sonnet", "haiku", "opus",
                               # o el nombre completo ("claude-sonnet-5")
tools = "Bash,WebSearch,Write,Read"  # herramientas PROPIAS de Claude Code (las de [tools] no le
                               # llegan): "" = ninguna (asistente conversacional a secas)
                               # "Bash,WebSearch,Read" = esas | "default" = todas
                               # OJO: su Bash no pasa por el guard de [tools.shell]
                               # Write y Read están por la ventana de chat: el fichero
                               # que pasa por ellas se ve dentro del chat (plegable, con
                               # el markdown pintado), y el que pasa por un `echo >` o un
                               # `cat` de Bash no, porque desde fuera no hay forma de
                               # saber cuál es. No dan permisos nuevos: Bash ya podía
                               # leer y escribir de todo.
permission_mode = "bypassPermissions"   # obligatorio si activas `tools`: sin terminal detrás nadie
                               # puede aprobar permisos. "bypassPermissions" (sin frenos),
                               # "acceptEdits" o "dontAsk"
safe_mode = true               # ignora CLAUDE.md, plugins, hooks y MCP del sistema: sin
                               # esto cada turno arrastra decenas de miles de tokens que
                               # no pintan nada en una conversación hablada
timeout_s = 120                # corta el turno si el CLI se atasca
cwd = ""                       # directorio de trabajo del CLI ("" = desde donde lances
                               # maripepis); solo importa si le das herramientas

[tts]
enabled = false                # true, o usa --speak, para responder por voz
engine = "piper"
voice = "models/piper/es_ES-sharvard-medium.onnx"

[tools]
enabled = true                 # el asistente puede abrir apps, buscar en internet,
                               # consultar el tiempo (wttr.in) y ejecutar comandos
                               # (solo con backend = "claude": claude-code trae las suyas)

[tools.shell]
# Tocar tus ficheros: órdenes de zsh («créame una carpeta fotos» y te la crea, no
# te explica cómo), escribir documentos («guárdame la lista de la compra») y leerlos
# («revisa el resumen»). Son las herramientas con más alcance: lee esto antes de
# tocarlo.
enabled = true                 # false = el asistente no puede tocar tus ficheros
                               # (ni ejecutar_comando, ni escribir_fichero, ni
                               #  leer_fichero)
guard = true                   # veta lo irreversible (formatear, rm de / o del home,
                               # curl | sh). false = sin red; tú verás
timeout_s = 20                 # corta el comando si tarda más (no hay teclado detrás:
                               # lo que pida datos se queda esperando hasta aquí)
max_output_chars = 2000        # tope de salida que se le pasa al LLM (y que puede acabar
                               # dicha en voz alta)

[tools.whatsapp]
# «Mándale un wasap a Marta»: abre su chat en ZapZap y deja el mensaje ESCRITO en
# el cuadro de texto. No lo envía, y no es que no se pueda: es la única acción que
# le llega a otra persona y la única que no se deshace, así que el Enter lo das tú,
# viendo a quién va y qué pone. Un fallo del micrófono se queda entonces en un
# mensaje que no llegas a enviar, no en uno que ya no puedes retirar.
enabled = true                 # false = el asistente no puede abrirle el chat a nadie
modo = "envio"                 # "borrador" = lo de arriba: lo deja escrito, el Enter lo das tú.
                               # "envio"    = lo ENVÍA por la sesión propia de Maripepis,
                               #              pero antes te lo lee y espera tu «sí»:
                               #                  — Mándale un wasap a Edu: llego en diez.
                               #                  — A Edu: «llego en diez». ¿Te lo mando?
                               #                  — Sí.        (y ahí sale, no antes)
                               #              El «sí» tiene que ir en otro turno y el mensaje
                               #              preparado caduca al minuto; la herramienta que
                               #              confirma no lleva ni destinatario ni texto, así
                               #              que solo puede mandar lo que acabas de oír.
                               #              Requiere el servicio maripepis-whatsapp
                               #              corriendo (ver packaging/) y la extra:
                               #                  pip install -e '.[whatsapp]'
                               #                  maripepis-wa vincular
                               #              Piénsalo dos veces igualmente: aquí ya no hay
                               #              pantalla que mirar, y si dices que sí sin
                               #              escuchar, lo único que te queda es el «eliminar
                               #              para todos» de WhatsApp, que dura un rato.
agenda = ""                    # vacío = ~/.config/maripepis/contactos.toml. Un TOML a
                               # mano, una línea por contacto:
                               #     marta = "+34600112233"
                               #     "mi hermana" = "+34600112233"
                               # (varios nombres para el mismo número: vale cualquiera al
                               #  hablar. Los que llevan espacios, ENTRE COMILLAS: sin
                               #  ellas el TOML no es válido y la agenda se queda a cero)
                               #
                               # Y los grupos, al final del fichero y en su sección:
                               #     [grupos]
                               #     familia = "120363021234567890@g.us"
                               # Un grupo no tiene teléfono, tiene un identificador que
                               # solo se ve desde dentro de la sesión; te lo dice
                               #     maripepis-wa grupos familia
                               # Apunta los tres o cuatro a los que de verdad escribes:
                               # esta lista de nombres viaja al modelo en cada frase.
                               # Solo funcionan con modo = "envio" (a un grupo no se le
                               # puede abrir el chat con un enlace).
                               #
                               # Va fuera del proyecto a propósito: son teléfonos, y
                               # config.toml está en git. Al modelo se le pasan los
                               # NOMBRES, nunca los números ni los identificadores.
prefijo = "34"                 # prefijo de país para los números de 9 cifras; los que
                               # empiezan por + o por 00 se respetan tal cual
cliente = "zapzap"             # quien abre WhatsApp; tiene que entender un whatsapp://
                               # en la línea de órdenes

[memory]
enabled = true                 # datos fijos del usuario y del equipo, siempre presentes
path = ""                      # vacío = ~/.config/maripepis/memoria.md, o memoria.md junto
                               # a este fichero (las rutas relativas van contra config.toml)
max_chars = 4000               # tope de seguridad: la memoria viaja en CADA petición al LLM

[hotkey]
# Tecla de hablar global (--daemon + ALT+Z en Hyprland). Ver README.
socket = ""                    # ruta del socket; vacío = $XDG_RUNTIME_DIR/maripepis.sock
speak = true                   # el modo asistente responde por voz (Piper)
silence_ms = 2500              # red de seguridad: corta si te callas este rato
                               # (más largo que [vad]: aquí piensas con la tecla pulsada)
max_ms = 60000                 # tope duro: corta al minuto aunque no sueltes la tecla
min_speech_ms = 300            # voz real mínima; por debajo se descarta como ruido
aggressiveness = 2             # 0-3 del VAD, igual que en [vad]
context_timeout_s = 300        # olvida la conversación tras 5 min sin usarla (0 = nunca)
notify = true                  # avisos de escritorio (notify-send)
notify_chars = 240             # recorta el texto largo en los avisos
window = true                  # ventana de chat: se abre sola con ALT+Z (no con el
                               # dictado) y va escribiendo la conversación. Dónde
                               # aparece lo decide Hyprland: ver la regla
                               # ^maripepis-chat$ en ~/.config/hypr/hyprland.lua
window_python = ""             # "" = `python3` del sistema, que es el que ve GTK4
                               # (python-gobject); el .venv del proyecto no lo ve
auto_paste = false             # en dictado, además de copiar, pega en la ventana activa
                               # (SHIFT+Insert; puede dejar modificadores pegados — ver README)
paste_delay_ms = 250           # espera antes de pegar, para que sueltes ALT/SHIFT

[app]
wake_word = ""                 # p.ej. "oye maripepis": en voz, solo responde si la oye
exit_phrases = ["adiós maripepis", "hasta luego"]   # además de: salir, adiós, chao...
log_level = "INFO"
