[build-system]
requires = ["setuptools>=77"]   # >=77: entiende PEP 639 (license = "MIT")
build-backend = "setuptools.build_meta"

[project]
name = "maripepis"
version = "0.1.0"
description = "Asistente de voz para Linux, con Claude por API o por suscripción."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Manu Guevara Casado" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Backend Claude por API. El backend claude-code habla con el CLI y no necesita nada.
claude = ["anthropic>=0.40"]
# Voz de salida (Fase 2). La reproducción usa `aplay` (alsa-utils, del sistema).
tts = ["piper-tts>=1.2"]
# Sesión propia de WhatsApp (enviar de verdad, y grupos). neonize son bindings de
# whatsmeow, así que se trae un binario Go dentro. Sin esto, la herramienta sigue
# funcionando en modo borrador: abre el chat y deja el mensaje escrito.
whatsapp = ["neonize>=0.4.3"]
# Voz de entrada (Fase 3).
stt = ["faster-whisper>=1.0"]
# Aceleración por GPU NVIDIA para Whisper (CUDA 12 + cuDNN 9, sin tocar el sistema).
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
# Captura de micrófono y VAD (Fases 3-4).
# webrtcvad importa pkg_resources → necesita setuptools<81 (eliminado en 81+).
audio = ["sounddevice>=0.4", "numpy>=1.26", "webrtcvad>=2.0.10", "setuptools<81"]
# Todo lo de voz de una vez.
voice = [
    "piper-tts>=1.2",
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "webrtcvad>=2.0.10",
    "setuptools<81",
]
dev = ["pytest>=8"]

[project.scripts]
maripepis = "maripepis.cli:main"
# Cliente de la tecla de hablar: lo lanza Hyprland en cada pulsación (ver README).
maripepis-hotkey = "maripepis.hotkey.client:main"
# WhatsApp por la shell: es como la usan los proveedores que traen sus propias
# herramientas (claude-code) y no aceptan las nuestras. Ver tools/whatsapp.py.
maripepis-whatsapp = "maripepis.tools.whatsapp:main"
# La sesión de WhatsApp: el demonio (lo arranca systemd) y con quién mirarlo.
maripepis-whatsappd = "maripepis.whatsapp.daemon:main"
maripepis-wa = "maripepis.whatsapp.cliente:main"

[tool.setuptools.packages.find]
include = ["maripepis*"]
