[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maripepis"
version = "0.1.0"
description = "Asistente de voz local para Linux con proveedor de LLM intercambiable (Ollama ↔ Claude)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Backend Claude (nube). El backend Ollama no necesita nada extra.
claude = ["anthropic>=0.40"]
# Voz de salida (Fase 2). La reproducción usa `aplay` (alsa-utils, del sistema).
tts = ["piper-tts>=1.2"]
# Voz de entrada (Fase 3).
stt = ["faster-whisper>=1.0"]
# Aceleración por GPU NVIDIA para Whisper (CUDA 12 + cuDNN 9, sin tocar el sistema).
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
# Captura de micrófono y VAD (Fases 3-4).
# webrtcvad importa pkg_resources → necesita setuptools<81 (eliminado en 81+).
audio = ["sounddevice>=0.4", "numpy>=1.26", "webrtcvad>=2.0.10", "setuptools<81"]
# Todo lo de voz de una vez.
voice = [
    "piper-tts>=1.2",
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "webrtcvad>=2.0.10",
    "setuptools<81",
]
dev = ["pytest>=8"]

[project.scripts]
maripepis = "maripepis.cli:main"
# Cliente de la tecla de hablar: lo lanza Hyprland en cada pulsación (ver README).
maripepis-hotkey = "maripepis.hotkey.client:main"

[tool.setuptools.packages.find]
include = ["maripepis*"]
